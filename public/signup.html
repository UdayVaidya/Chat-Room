<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - ConnectHub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="signup-form">
      <div class="heading">
        <div class="l">S</div>
        <div class="o">i</div>
        <div class="l">g</div>
        <div class="l">n</div>
        <div class="o">u</div>
        <div class="l">p</div>
      </div>
      <form id="signupForm">
        <input type="text" id="username" placeholder="Username" required autocomplete="username" minlength="3" />
        <input type="password" id="password" placeholder="Password" required autocomplete="new-password" minlength="6" />
        <button type="submit">Sign Up</button>
      </form>
      <p style="margin-top: 20px; color: rgba(255, 255, 255, 0.7); font-size: 14px;">
        Already have an account? <a href="login.html" style="color: #ff6b35; text-decoration: none; font-weight: 600;">Login</a>
      </p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
